<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaintMix Trial Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100">
<div class="max-w-md mx-auto p-4">
<div class="bg-white rounded-2xl shadow p-4">
<h1 class="text-2xl font-bold text-blue-700">PaintMix Trial Calculator</h1>

<label class="block mt-4 font-semibold">Target Produksi (gram)</label>
<input id="target" value="100" type="number" class="w-full border rounded-xl p-3">

<div id="list" class="space-y-4 mt-5"></div>

<button onclick="addPigment()" class="w-full mt-3 bg-green-600 text-white rounded-xl py-3">+ Tambah Pigmen</button>

<div class="mt-5 p-4 bg-orange-100 rounded-xl">
Total Formula : <span id="totalFormula">0</span> gram
</div>

<button onclick="calculate()" class="w-full mt-4 bg-blue-600 text-white rounded-xl py-3">Hitung Produksi</button>
</div>
</div>

<script>
const list=document.getElementById('list');

function addPigment(name='',base=''){
 const card=document.createElement('div');
 card.className='bg-white border rounded-xl p-3';
 card.innerHTML=`
 <input class="name w-full border rounded p-2 mb-2" placeholder="Nama Pigmen" value="${name}">
 <div class="grid grid-cols-2 gap-2">
 <input class="base border rounded p-2" type="number" step="0.01" value="${base}" placeholder="Gram Awal" oninput="updateTotal()">
 <input class="adjust border rounded p-2" type="number" step="0.01" value="0" placeholder="Koreksi" oninput="updateTotal()">
 </div>
 <div class="mt-2 text-sm">Formula Sekarang : <b class="current">0</b> g</div>
 <div class="mt-2 bg-blue-600 text-white rounded-xl p-3 text-center">
 <div class="text-xs">Tambahkan</div>
 <div class="result text-3xl font-bold">0 g</div>
 </div>
 <div class="mt-2 text-sm">Berhenti saat timbangan menunjukkan <b class="scale">0</b> g</div>
 <button onclick="this.parentElement.remove();updateTotal();" class="mt-3 w-full bg-red-500 text-white rounded p-2">Hapus</button>`;
 list.appendChild(card);
 updateTotal();
}
function updateTotal(){
 let total=0;
 document.querySelectorAll('#list>div').forEach(c=>{
   let now=(parseFloat(c.querySelector('.base').value)||0)+(parseFloat(c.querySelector('.adjust').value)||0);
   c.querySelector('.current').textContent=now.toFixed(2);
   total+=now;
 });
 totalFormula.textContent=total.toFixed(2);
}
function calculate(){
 let base=parseFloat(totalFormula.textContent)||1;
 let target=parseFloat(target.value)||0;
 let f=target/base,cum=0;
 document.querySelectorAll('#list>div').forEach(c=>{
   let now=parseFloat(c.querySelector('.current').textContent)||0;
   let res=now*f;
   cum+=res;
   c.querySelector('.result').textContent=res.toFixed(2)+' g';
   c.querySelector('.scale').textContent=cum.toFixed(2);
 });
}
addPigment('Biru',5);
addPigment('Merah',5);
addPigment('Hijau',5);
</script>
</body>
</html>
