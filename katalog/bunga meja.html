
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fdf2f8">
  <title>Katalog Bunga Meja Floris</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .product-image {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      background: #fce7f3;
    }

    .product[hidden] {
      display: none !important;
    }
  </style>
</head>

<body class="bg-pink-50 font-sans">
  <section class="max-w-6xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-center text-pink-800 mb-6">
      Katalog Bunga Meja
    </h1>

    <div class="mb-8 flex flex-col md:flex-row gap-4">
      <div class="flex-1">
        <input
          type="search"
          id="searchInput"
          placeholder="Cari bunga meja favoritmu..."
          aria-label="Cari nama bunga meja"
          class="w-full rounded-2xl border border-pink-200 bg-white px-5 py-3 text-gray-700 shadow-sm focus:border-pink-400 focus:outline-none focus:ring-2 focus:ring-pink-200">
      </div>

      <div class="relative w-full md:w-56">
        <button
          id="priceButton"
          type="button"
          aria-expanded="false"
          aria-controls="priceDropdown"
          class="w-full rounded-2xl border border-pink-300 bg-white px-5 py-3 text-pink-800 font-medium shadow-sm flex justify-between items-center hover:bg-pink-200 transition">
          <span id="selectedPrice">Semua Harga</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor"
            viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>

        <div id="priceDropdown"
          class="hidden absolute z-50 mt-2 w-full bg-pink-50 border border-pink-200 rounded-2xl shadow-lg overflow-hidden">
          <button type="button" class="price-option w-full text-left px-5 py-3 text-pink-800 hover:bg-pink-100" data-value="all">Semua Harga</button>
          <button type="button" class="price-option w-full text-left px-5 py-3 text-pink-800 hover:bg-pink-100" data-value="0-49999">Di bawah Rp50.000</button>
          <button type="button" class="price-option w-full text-left px-5 py-3 text-pink-800 hover:bg-pink-100" data-value="50000-100000">Rp50.000 - Rp100.000</button>
          <button type="button" class="price-option w-full text-left px-5 py-3 text-pink-800 hover:bg-pink-100" data-value="100001-200000">Rp100.000 - Rp200.000</button>
          <button type="button" class="price-option w-full text-left px-5 py-3 text-pink-800 hover:bg-pink-100" data-value="200001-99999999">Di atas Rp200.000</button>
        </div>
      </div>
    </div>

    <p id="resultCount" class="text-sm text-pink-800 mb-4" aria-live="polite"></p>

    <div id="statusMessage" class="text-center text-gray-600 py-8">
      Memuat katalog bunga meja...
    </div>

    <div id="productGrid" class="grid grid-cols-2 gap-4"></div>

    <p id="emptyMessage" class="hidden text-center text-gray-600 py-8">
      Bunga meja tidak ditemukan. Coba kata kunci atau rentang harga lain.
    </p>
  </section>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx6OD3ghSmP5YFBGlq851DlRZRGmLVokaZskObvMqwBcQZ_OhhbviNO1CxyZjp39xxetg/exec";

    const grid = document.getElementById("productGrid");
    const searchInput = document.getElementById("searchInput");
    const priceButton = document.getElementById("priceButton");
    const priceDropdown = document.getElementById("priceDropdown");
    const selectedPrice = document.getElementById("selectedPrice");
    const priceOptions = document.querySelectorAll(".price-option");
    const resultCount = document.getElementById("resultCount");
    const emptyMessage = document.getElementById("emptyMessage");
    const statusMessage = document.getElementById("statusMessage");

    let products = [];
    let selectedPriceValue = "all";

    function money(value) {
      const angka = Number(String(value).replace(/[^\d-]/g, ""));
      return "Rp" + angka.toLocaleString("id-ID");
    }

    function getImageUrl(link) {
      link = String(link || "").trim();

      if (!link) return "";

      const driveMatch =
        link.match(/drive\.google\.com\/file\/d\/([^/?]+)/) ||
        link.match(/[?&]id=([^&]+)/);

      if (driveMatch) {
        return "https://drive.google.com/thumbnail?id=" +
          encodeURIComponent(driveMatch[1]) + "&sz=w900";
      }

      return link;
    }

    function renderProducts(data) {
      grid.replaceChildren();
      const fragment = document.createDocumentFragment();

      data.forEach((product, index) => {
        const card = document.createElement("article");
        card.className =
          "product bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition";

        card.dataset.name = String(
          product.nama || ""
        ).toLowerCase();

        card.dataset.price = String(
          Number(product.harga) || 0
        );

        const img = document.createElement("img");
        img.className = "product-image";
        img.alt = product.judul || product.nama || "Foto bunga meja";
        img.width = 400;
        img.height = 500;
        img.decoding = "async";

        if (index === 0) {
          img.loading = "eager";
          img.fetchPriority = "high";
        } else {
          img.loading = "lazy";
        }

        img.src = getImageUrl(product.link_foto);

        img.onerror = function () {
          this.onerror = null;
          this.removeAttribute("src");
          this.alt = "Foto tidak dapat dimuat. Periksa link Google Drive.";
        };

        const details = document.createElement("div");
        details.className = "p-3";

        const title = document.createElement("h2");
        title.className = "text-sm font-semibold text-gray-800";
        title.textContent = product.judul || product.nama || "Bunga Meja";

        const price = document.createElement("p");
        price.className = "text-pink-700 font-bold text-sm mt-1";
        price.textContent = money(product.harga);

        const order = document.createElement("a");
        const phone = String(product.nomor_wa || "").replace(/\D/g, "");

        const message = "Halo kak, saya ingin memesan " +
          String(product.pesan || product.judul || product.nama || "bunga meja") +
          " dengan harga " + money(product.harga);

        order.href = phone
          ? "https://wa.me/" + phone + "?text=" + encodeURIComponent(message)
          : "#";

        order.target = "_blank";
        order.rel = "noopener noreferrer";
        order.className =
          "mt-3 block text-center bg-pink-400 hover:bg-pink-500 text-white text-sm font-semibold py-2 rounded-xl transition";
        order.textContent = "Order Sekarang";

        if (!phone) {
          order.addEventListener("click", event => {
            event.preventDefault();
            alert("Nomor WhatsApp produk ini belum diisi di Google Sheets.");
          });
        }

        details.append(title, price, order);
        card.append(img, details);
        fragment.appendChild(card);
      });

      grid.appendChild(fragment);
      filterProducts();
      statusMessage.classList.add("hidden");
    }

    function filterProducts() {
      const searchValue = searchInput.value.toLowerCase().trim();
      const cards = Array.from(grid.querySelectorAll(".product"));
      let visibleCount = 0;

      cards.forEach(card => {
        const name = card.dataset.name || "";
        const price = Number(card.dataset.price) || 0;
        const matchName = name.includes(searchValue);

        let matchPrice = true;

        if (selectedPriceValue !== "all") {
          const [min, max] = selectedPriceValue.split("-").map(Number);
          matchPrice = price >= min && price <= max;
        }

        const show = matchName && matchPrice;
        card.hidden = !show;

        if (show) visibleCount++;
      });

      resultCount.textContent = visibleCount + " produk ditemukan";
      emptyMessage.classList.toggle("hidden", visibleCount !== 0);
    }

    function loadProducts() {
      if (!API_URL.startsWith("https://script.google.com/")) {
        statusMessage.textContent =
          "Masukkan URL Web App Apps Script terlebih dahulu.";
        return;
      }

      const callbackName = "__bungaMejaDataCallback";

      window[callbackName] = function (data) {
        delete window[callbackName];

        if (!Array.isArray(data)) {
          statusMessage.textContent =
            "Data katalog tidak sesuai. Periksa Apps Script dan tab BungaMeja.";
          return;
        }

        products = data;
        renderProducts(products);

        if (products.length === 0) {
          statusMessage.textContent =
            "Belum ada bunga meja aktif. Periksa isi Google Sheets.";
          statusMessage.classList.remove("hidden");
        }
      };

      const script = document.createElement("script");
      script.src = API_URL + "?kategori=bunga_meja&callback=" + callbackName;

      script.onerror = function () {
        delete window[callbackName];
        statusMessage.textContent =
          "Katalog gagal dimuat. Periksa URL Web App dan pengaturan aksesnya.";
      };

      document.body.appendChild(script);
    }

    priceButton.addEventListener("click", () => {
      const isHidden = priceDropdown.classList.toggle("hidden");
      priceButton.setAttribute("aria-expanded", String(!isHidden));
    });

    priceOptions.forEach(option => {
      option.addEventListener("click", () => {
        selectedPriceValue = option.dataset.value;
        selectedPrice.textContent = option.textContent.trim();
        priceDropdown.classList.add("hidden");
        priceButton.setAttribute("aria-expanded", "false");
        filterProducts();
      });
    });

    document.addEventListener("click", event => {
      if (
        !priceButton.contains(event.target) &&
        !priceDropdown.contains(event.target)
      ) {
        priceDropdown.classList.add("hidden");
        priceButton.setAttribute("aria-expanded", "false");
      }
    });

    searchInput.addEventListener("input", filterProducts);

    loadProducts();
  </script>
</body>
</html>
